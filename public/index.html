<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <title>Kestrel Kids Safety Desk</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/director.css">
  <link rel="stylesheet" href="/operations.css">
  <link rel="stylesheet" href="/patrol.css">
  <script type="module" src="/workspace.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap brand">
      <span class="brand-mark" aria-hidden="true">▲</span>
      <strong>Kestrel Kids</strong>
      <span class="brand-detail">Safety Desk</span>
    </div>
  </header>
  <section class="demo" aria-label="Demo controls" data-testid="demo-banner">
    <div class="wrap demo-inner">
      <div><strong>Interactive demo</strong></div>
      <label for="view-as">View as
        <select id="view-as" data-testid="view-as" disabled></select>
      </label>
    </div>
  </section>
  <div class="navigation">
    <nav class="wrap" aria-label="Workspace" data-testid="workspace-nav"></nav>
  </div>
  <main class="wrap">
    <div class="workspace">
      <p class="date" id="lesson-date"></p>
      <h1 data-testid="workspace-title">School desk workspace</h1>
      <div id="director" hidden></div>
      <div id="operations" hidden data-testid="operations"></div>
      <div id="patrol" hidden data-testid="patrol"></div>
      <div id="guardian" hidden data-testid="guardian"></div>
      <section id="starter-panel" class="panel" aria-labelledby="section-title">
        <div class="panel-head">
          <h2 id="section-title"></h2>
          <label class="search" hidden>Find a child
            <input type="search" placeholder="Name or bib" data-testid="roster-search">
          </label>
        </div>
        <p id="message" class="message" role="status">Loading lesson day…</p>
        <ul id="roster" class="roster" aria-label="Children"></ul>
      </section>
      <section id="instructor-view" class="instructor-view" aria-label="Instructor group" hidden>
        <p id="offline-status" class="message offline-status"></p>
        <div class="group-heading">
          <h2 id="instructor-group-title"></h2>
          <strong id="group-count"></strong>
        </div>
        <ol id="instructor-roster" class="instructor-roster" aria-label="Today’s group"></ol>
        <section class="must-know" aria-labelledby="must-know-heading">
          <h3 id="must-know-heading"></h3>
          <div id="medical-notes"></div>
        </section>
        <button id="report-missing" class="primary-action" type="button">Report missing child by radio</button>
        <form id="radio-report" class="radio-report" hidden>
          <h3>Missing child radio report</h3>
          <label>Child
            <select name="childId" required></select>
          </label>
          <label>Last seen at
            <input name="lastSeen" required placeholder="e.g. base of Spruce chair">
          </label>
          <button class="primary-action" type="submit">Send report to desk</button>
          <p id="radio-report-status" role="status"></p>
        </form>
      </section>
    </div>
  </main>
  <template id="roster-item">
    <li data-testid="roster-row">
      <div class="identity"><strong></strong><span class="group"></span></div>
      <span class="bib"></span>
      <span class="status"></span>
    </li>
  </template>
  <template id="instructor-roster-item">
    <li><span class="instructor-number"></span><strong></strong><span class="bib"></span></li>
  </template>
</body>
</html>
