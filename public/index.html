<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <title>Kestrel Kids Safety Desk</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/director.css">
  <link rel="stylesheet" href="/operations.css">
  <link rel="stylesheet" href="/patrol.css">
  <script type="module" src="/workspace.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap brand">
      <span class="brand-mark" aria-hidden="true">▲</span>
      <strong>Kestrel Kids</strong>
      <span class="brand-detail">Safety Desk</span>
    </div>
  </header>
  <section class="demo" aria-label="Demo controls" data-testid="demo-banner">
    <div class="wrap demo-inner">
      <div><strong>Interactive demo</strong></div>
      <label for="view-as">View as
        <select id="view-as" data-testid="view-as" disabled></select>
      </label>
      <button class="live-sign-in" type="button" data-testid="live-sign-in">Staff sign in</button>
    </div>
  </section>
  <div class="navigation">
    <nav class="wrap" aria-label="Workspace" data-testid="workspace-nav"></nav>
  </div>
  <main class="wrap">
    <div class="workspace">
      <p class="date" id="lesson-date"></p>
      <h1 data-testid="workspace-title">School desk workspace</h1>
      <div id="director" hidden></div>
      <div id="operations" hidden data-testid="operations"></div>
      <div id="patrol" hidden data-testid="patrol"></div>
      <div id="guardian" hidden data-testid="guardian"></div>
      <section id="live-workspace" hidden aria-live="polite"></section>
      <section id="starter-panel" class="panel" aria-labelledby="section-title">
        <div class="panel-head">
          <h2 id="section-title"></h2>
          <label class="search" hidden>Find a child
            <input type="search" placeholder="Name or bib" data-testid="roster-search">
          </label>
        </div>
        <p id="message" class="message" role="status">Loading lesson day…</p>
        <ul id="roster" class="roster" aria-label="Children"></ul>
      </section>
    </div>
  </main>
  <template id="roster-item">
    <li data-testid="roster-row">
      <div class="identity"><strong></strong><span class="group"></span></div>
      <span class="bib"></span>
      <span class="status"></span>
    </li>
  </template>
  <dialog id="staff-dialog" class="o-dialog" aria-labelledby="staff-dialog-title">
    <header><div><p>Secure staff access</p><h2 id="staff-dialog-title">Staff sign in</h2></div><button type="button" class="o-button" data-testid="staff-close">Close</button></header>
    <form id="staff-sign-in" class="o-dialog-body"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="o-button o-primary" type="submit" data-testid="staff-submit">Sign in</button><p class="o-note" role="status" data-testid="staff-message">Use an account created for this app by the administrator.</p></form>
  </dialog>
  <script type="module" src="/live.js"></script>
</body>
</html>
